<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./brand.png" />
    <title>Планировщик смен</title>
    <!-- Библиотеки XLSX и ExcelJS теперь устанавливаются локально через npm, не требуют интернета -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('plan_ui_scale');
          var scale = raw != null ? parseFloat(raw) : 1;
          scale = Math.max(0.5, Math.min(1.5, Math.round(scale * 20) / 20));
          document.documentElement.style.fontSize = (16 * scale) + 'px';
        } catch (e) {}
      })();
    </script>
    <style>
      /* Предзагрузка для предотвращения FOUC */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
      }
      #root {
        min-height: 100vh;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DYbICSRB.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DRL4YuBn.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
